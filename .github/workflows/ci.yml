name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Distribution must be pure Go: prove the binary builds with cgo disabled.
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - run: go vet ./...
      # The race detector requires cgo, so tests run with the runner's default toolchain.
      - run: go test ./... -race
