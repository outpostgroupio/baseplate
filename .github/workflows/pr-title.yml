name: pr-title
# We squash-merge only, so a PR's title becomes the commit subject on main (and
# the changelog line). Enforce Conventional Commits on the PR title.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write # to leave/update a comment explaining failures

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with .goreleaser.yaml changelog groups/filters.
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            style
            revert
