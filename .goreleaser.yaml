version: 2

project_name: baseplate

before:
  hooks:
    - go mod download

builds:
  - id: baseplate
    main: ./cmd/baseplate
    binary: baseplate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/outpostgroupio/baseplate/internal/version.Version={{ .Version }}
      - -X github.com/outpostgroupio/baseplate/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/outpostgroupio/baseplate/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: baseplate
    formats:
      - tar.gz
    name_template: "baseplate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# A keyless Sigstore signature over checksums.txt, which covers every archive. The release workflow
# installs cosign and grants the OIDC token it signs with.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

changelog:
  use: github
  sort: asc
  format: '[{{ printf "%.7s" .SHA }}](https://github.com/outpostgroupio/baseplate/commit/{{ .SHA }}) {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^ci'
      - '^docs'
      - '^style'
      - '^build'
      - '(?i)^merge[ :(]'

release:
  prerelease: auto

# Every release before 1.0 is a release candidate, so the tap and the bucket take them too. At
# v1.0.0, set skip_upload: auto on both so they only follow full releases.
homebrew_casks:
  - name: baseplate
    binaries:
      - baseplate
    homepage: https://github.com/outpostgroupio/baseplate
    description: Infrastructure as code for Roblox
    license: MIT
    repository:
      owner: outpostgroupio
      name: homebrew-tap
      git:
        url: git@github.com:outpostgroupio/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # The binary isn't notarized, so Gatekeeper won't run it from a cask with the quarantine flag set.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/baseplate"]
          end

scoops:
  - name: baseplate
    homepage: https://github.com/outpostgroupio/baseplate
    description: Infrastructure as code for Roblox
    license: MIT
    repository:
      owner: outpostgroupio
      name: scoop-bucket
      git:
        url: git@github.com:outpostgroupio/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_DEPLOY_KEY }}"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
