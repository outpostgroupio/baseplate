version: 2

project_name: baseplate

before:
  hooks:
    - go mod download

builds:
  - id: baseplate
    main: ./cmd/baseplate
    binary: baseplate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/outpostgroupio/baseplate/internal/version.Version={{ .Version }}
      - -X github.com/outpostgroupio/baseplate/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/outpostgroupio/baseplate/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: baseplate
    formats:
      - tar.gz
    name_template: "baseplate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  format: '[{{ printf "%.7s" .SHA }}](https://github.com/outpostgroupio/baseplate/commit/{{ .SHA }}) {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^ci'
      - '^docs'
      - '^style'
      - '^build'
      - '(?i)^merge[ :(]'

release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
