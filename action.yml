name: "Baseplate"
description: "Run Baseplate (plan/apply/destroy/validate) for Roblox infrastructure-as-code."
inputs:
  command:
    description: "Baseplate subcommand: plan, apply, destroy, validate, or restart-servers."
    required: false
    default: "plan"
  args:
    description: "Extra arguments (e.g. --config infra.bp.hcl --auto-approve)."
    required: false
    default: ""
  version:
    description: "Baseplate version to install: a tag, a commit SHA or latest. Empty (the default) installs the version matching the ref this action is pinned to. Release tags install the release binary; other refs are built from source."
    required: false
    default: ""
  token:
    description: "GitHub token used to look up and download the release."
    required: false
    default: ${{ github.token }}
  api-key:
    description: "Roblox Open Cloud API key, exported as ROBLOX_API_KEY."
    required: false
    default: ""
  working-directory:
    description: "Directory to run in."
    required: false
    default: "."
outputs:
  output:
    description: "Captured stdout+stderr of the command."
    value: ${{ steps.run.outputs.output }}
  changes:
    description: "For plan: 'true' if there are changes, 'false' if converged."
    value: ${{ steps.run.outputs.changes }}
runs:
  using: "composite"
  steps:
    # Use the release binary when the version is a release, checked against checksums.txt. Other
    # refs (a commit SHA, a branch, a local checkout) and unsupported runners build from source.
    - id: download
      shell: bash
      env:
        BP_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        repo=outpostgroupio/baseplate
        fallback() { echo "$1, so building from source."; echo "installed=false" >> "$GITHUB_OUTPUT"; exit 0; }
        command -v gh >/dev/null || fallback "The gh CLI isn't installed"
        case "$RUNNER_OS" in
          Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; *) fallback "No release build for $RUNNER_OS" ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;; ARM64) arch=arm64 ;; *) fallback "No release build for $RUNNER_ARCH" ;;
        esac
        tag="$BP_VERSION"
        if [ -z "$tag" ]; then
          # The ref the action is pinned to is the last part of its checkout path (_actions/<owner>/<repo>/<ref>).
          path="${GITHUB_ACTION_PATH//\\//}"
          tag="${path##*/}"
        elif [ "$tag" = latest ]; then
          # Like `go install @latest`: the newest full release, or the newest pre-release if there's
          # no full release yet. (tr because gh on Windows ends its output with CRLF.)
          latest() { gh release list -R "$repo" --exclude-drafts "$@" -L 1 --json tagName -q '.[0].tagName // empty' | tr -d '\r'; }
          tag="$(latest --exclude-pre-releases)"
          [ -n "$tag" ] || tag="$(latest)"
          [ -n "$tag" ] || fallback "There are no releases"
        fi
        gh release view "$tag" -R "$repo" --json tagName >/dev/null 2>&1 || fallback "$tag isn't a release"
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        asset="baseplate_${tag#v}_${os}_${arch}.${ext}"
        dir="$RUNNER_TEMP/baseplate-$tag"
        mkdir -p "$dir"
        gh release download "$tag" -R "$repo" -D "$dir" --clobber -p "$asset" -p checksums.txt
        cd "$dir"
        awk -v a="$asset" '$2 == a' checksums.txt > expected.txt
        [ -s expected.txt ] || { echo "$asset isn't listed in checksums.txt"; exit 1; }
        if command -v sha256sum >/dev/null; then sha256sum -c expected.txt; else shasum -a 256 -c expected.txt; fi
        if [ "$ext" = zip ]; then
          pwsh -NoProfile -Command "Expand-Archive -Force -Path '$asset' -DestinationPath '$dir/bin'"
        else
          mkdir -p bin && tar -xzf "$asset" -C bin
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "Installed Baseplate $tag ($os/$arch) from the release."
        echo "installed=true" >> "$GITHUB_OUTPUT"
    - if: steps.download.outputs.installed != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"
    - if: steps.download.outputs.installed != 'true'
      shell: bash
      env:
        BP_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$BP_VERSION" ]; then
          go install "github.com/outpostgroupio/baseplate/cmd/baseplate@${BP_VERSION}"
        else
          # The action's own checkout, so pinning the action also pins the tool.
          (cd "$GITHUB_ACTION_PATH" && go install ./cmd/baseplate)
        fi
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - id: run
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.api-key }}
        BP_COMMAND: ${{ inputs.command }}
        BP_ARGS: ${{ inputs.args }}
        BP_WORKDIR: ${{ inputs.working-directory }}
      run: |
        set +e
        cd "$BP_WORKDIR" || exit 1
        out="$(baseplate "$BP_COMMAND" $BP_ARGS 2>&1)"
        code=$?
        echo "$out"
        delim="BP_$(openssl rand -hex 8)"
        {
          echo "output<<$delim"
          echo "$out"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
        if [ "$BP_COMMAND" = "plan" ]; then
          case $code in
            0) echo "changes=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) exit $code ;;
          esac
        fi
        exit $code
