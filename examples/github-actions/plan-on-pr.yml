name: baseplate plan
on:
  pull_request:
jobs:
  plan:
    # Fork PRs have no secrets and a read-only token, so the comment would 403.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: outpostgroupio/baseplate@v0.1.0 # pin to a released tag or commit SHA
        with:
          command: plan
          args: --config baseplate.bp.hcl
          api-key: ${{ secrets.ROBLOX_API_KEY }}
      - uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.output }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        with:
          script: |
            const marker = '<!-- baseplate-plan -->';
            const plan = process.env.PLAN || '';
            const body = process.env.CHANGES === 'false'
              ? marker + '\n### Baseplate plan\nNo changes. Infrastructure is up to date.'
              : marker + '\n### Baseplate plan\n```\n' + plan + '\n```';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
